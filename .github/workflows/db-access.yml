name: Database Access Governance

env:
  DBGOV_VERSION: v0.0.5

on:
  pull_request:
    paths: ['policies/**']
  push:
    branches: [main]
    paths: ['policies/**']

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get changed policy files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: 'policies/**/*.yaml'

      - uses: amzar96/dbgov@${{ env.DBGOV_VERSION }}
        if: steps.changed.outputs.any_changed == 'true'
        with:
          command: plan
          policy_file: ${{ steps.changed.outputs.all_changed_files }}
          db_engine: postgres
          db_host: ${{ secrets.DBGOV_HOST }}
          db_port: ${{ secrets.DBGOV_PORT }}
          db_name: ${{ secrets.DBGOV_NAME }}
          db_user: ${{ secrets.DBGOV_USER }}
          db_password: ${{ secrets.DBGOV_PASSWORD }}
          db_options: ${{ secrets.DBGOV_OPTIONS }}
          db_sslmode: ${{ secrets.DBGOV_SSLMODE }}

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: amzar96/dbgov@${{ env.DBGOV_VERSION }}
        with:
          command: apply
          policy_file: ./policies/*.yaml
          db_engine: postgres
          db_host: ${{ secrets.DBGOV_HOST }}
          db_port: ${{ secrets.DBGOV_PORT }}
          db_name: ${{ secrets.DBGOV_NAME }}
          db_user: ${{ secrets.DBGOV_USER }}
          db_password: ${{ secrets.DBGOV_PASSWORD }}
          db_options: ${{ secrets.DBGOV_OPTIONS }}
          db_sslmode: ${{ secrets.DBGOV_SSLMODE }}
